services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qrcode_generator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. `app` waits for it to
  # finish successfully before starting. Also runs the operator scripts, which
  # email owners about disabled codes, hence the mail settings.
  migrate:
    build:
      context: .
      target: builder
    command: pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-qrcode_generator}?schema=public
      APP_URL: ${APP_URL:-http://localhost:${PORT:-3000}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-qrcode_generator}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — see .env.example}
      PORT: ${PORT:-3000}
      APP_URL: ${APP_URL:-http://localhost:${PORT:-3000}}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required — sign-in needs a confirmed email, see .env.example}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required — sign-in needs a confirmed email, see .env.example}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?SUPPORT_EMAIL is required — see .env.example}
      ABUSE_EMAIL: ${ABUSE_EMAIL:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:-}
      GATAG_ID: ${GATAG_ID:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-private}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_FACEBOOK_ID: ${AUTH_FACEBOOK_ID:-}
      AUTH_FACEBOOK_SECRET: ${AUTH_FACEBOOK_SECRET:-}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
      AUTH_GITLAB_ID: ${AUTH_GITLAB_ID:-}
      AUTH_GITLAB_SECRET: ${AUTH_GITLAB_SECRET:-}
      AUTH_LINKEDIN_ID: ${AUTH_LINKEDIN_ID:-}
      AUTH_LINKEDIN_SECRET: ${AUTH_LINKEDIN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
